<!DOCTYPE html>
<html>
<head>
  <title>Quiz Tebak Hewan 🐾</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 20px;">

  <h1>Quiz Tebak Hewan 🐾</h1>
  <h3 id="progress"></h3>

  <div id="emoji" style="font-size:100px;"></div>

  <div id="answers"></div>

  <h2 id="result"></h2>

  <button id="nextBtn" onclick="next()" disabled>Next</button>

  <script>
    const questions = [
      { emoji: "🐶", answer: "yuen", options: ["yuen", "Babi", "Monyet", "Tikus"] },
      { emoji: "🐷", answer: "rejak", options: ["rejak", "Sapi", "Kambing", "Monyet"] },
      { emoji: "🐵", answer: "noval", options: ["noval", "Kucing", "Anjing", "Tikus"] },
      { emoji: "🐭", answer: "dimas", options: ["dimas", "Hamster", "Kelinci", "Monyet"] },
      { emoji: "🐗", answer: "fatur", options: ["Babi", "fatur", "Kerbau", "Sapi"] }
    ];

    let index = 0;
    let score = 0;
    let answered = false;
    let selected = "";

    function loadQuestion() {
      const q = questions[index];

      document.getElementById("progress").innerText =
        "Soal " + (index + 1) + " / " + questions.length;

      document.getElementById("emoji").innerText = q.emoji;
      document.getElementById("result").innerText = "";
      document.getElementById("nextBtn").disabled = true;

      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.style.display = "block";
        btn.style.margin = "10px auto";
        btn.style.padding = "10px";

        btn.onclick = () => answer(opt, btn);

        answersDiv.appendChild(btn);
      });

      answered = false;
      selected = "";
    }

    function answer(choice, btn) {
      if (answered) return;

      answered = true;
      selected = choice;

      if (choice === questions[index].answer) {
        score++;
      }

      const buttons = document.querySelectorAll("#answers button");

      buttons.forEach(b => {
        if (b.innerText === questions[index].answer) {
          b.style.backgroundColor = "green";
        } else if (b.innerText === selected) {
          b.style.backgroundColor = "red";
        } else {
          b.style.backgroundColor = "gray";
        }
      });

      document.getElementById("result").innerText =
        selected === questions[index].answer ? "Benar!" : "Salah!";

      document.getElementById("nextBtn").disabled = false;
    }

    function next() {
      if (index < questions.length - 1) {
        index++;
        loadQuestion();
      } else {
        document.body.innerHTML = `
          <h1>Quiz Selesai</h1>
          <h2>Skor kamu: ${score} / ${questions.length}</h2>
          <button onclick="location.reload()">Ulangi</button>
        `;
      }
    }

    loadQuestion();
  </script>

</body>
</html>
